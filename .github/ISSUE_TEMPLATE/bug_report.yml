name: Bug report / Hata bildirimi
description: Report a reproducible problem in English or Turkish / Türkçe veya İngilizce hata bildir.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English or Turkish is welcome. Never attach passwords, tokens, cookies, active QR codes or private config.json files.
        Türkçe veya İngilizce yazabilirsin. Şifre, giriş anahtarı, çerez, aktif QR kodu veya kişisel config.json ekleme.
  - type: input
    id: version
    attributes:
      label: App version / Uygulama sürümü
      placeholder: v2.4.4
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version / İşletim sistemi ve Node.js sürümü
      placeholder: Windows 11, Node.js 22.13+
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Tekrar etme adımları
      description: Explain which page and actions trigger the problem / Sorunu tetikleyen sayfayı ve işlemleri belirt.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / Beklenen ve gerçekleşen davranış
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted errors or screenshots / Gizli bilgileri temizlenmiş hata veya görseller
      description: Remove account identifiers and login data first / Önce hesap kimliklerini ve giriş bilgilerini gizle.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Gizlilik
      options:
        - label: I removed private data / Gizli verileri temizledim.
          required: true
